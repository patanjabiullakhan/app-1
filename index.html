<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    #cart {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <b>MiniShop</b>
    <span>🛒 Cart: <span id="count">0</span></span>
  </header>

  <main class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="T-Shirt">
      <h3>T-Shirt</h3>
      <p>₹499</p>
      <button onclick="addToCart(499)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Shoes">
      <h3>Shoes</h3>
      <p>₹999</p>
      <button onclick="addToCart(999)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Watch">
      <h3>Watch</h3>
      <p>₹799</p>
      <button onclick="addToCart(799)">Add to Cart</button>
    </div>
  </main>

  <section id="cart">
    <h2>Cart</h2>
    <p>Items: <span id="items">0</span></p>
    <p>Total: ₹<span id="total">0</span></p>
    <button onclick="checkout()">Checkout</button>
  </section>

  <script>
    let items = 0;
    let total = 0;

    function addToCart(price) {
      items++;
      total += price;

      document.getElementById("count").textContent = items;
      document.getElementById("items").textContent = items;
      document.getElementById("total").textContent = total;
    }

    function checkout() {
      if (items === 0) {
        alert("Your cart is empty!");
      } else {
        alert("Order placed! Total: ₹" + total);
      }
    }
  </script>

</body>
</html>
